services:
  postgres:
    image: docker.io/library/postgres:16.10-bookworm
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    #IMPORTANT Remove this before deploy on production server
    # ports:
    #   - "5432:5432"

    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend

  minio:
    image: cgr.dev/chainguard/minio
    container_name: minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Public S3 endpoint used by browsers.
      MINIO_SERVER_URL: https://media.${DOMAIN}

      # Optional console URL.
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN}

    volumes:
      - ./data/minio:/data

    # DO NOT expose 9000/9001 publicly.
    # Nginx accesses MinIO through the Docker network.

    #IMPORTANT Remove this before deploy on production server
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend

  minio-init:
    image: cgr.dev/chainguard/minio-client
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        mc alias set local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb \
          --ignore-existing \
          "local/$${S3_BUCKET}"

        mc anonymous set download \
          "local/$${S3_BUCKET}"

    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    expose:
      - "3000"

    networks:
      - backend

  nginx:
    image: nginx:1.31.3-alpine3.24
    container_name: nginx
    restart: unless-stopped

    depends_on:
      - app
      - minio

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      - backend

networks:
  backend:
    name: trustbeautystore_backend
    driver: bridge
